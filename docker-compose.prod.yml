# ==========================================================
# dexter.fit.vutbr.cz deploy — https://dexter.fit.vutbr.cz/analyticity/brno/
#
# Four containers: central DB, api (everything the web calls: map, dashboards, case
# studies, risky road sections, administration), web and the project proxy.
#
# The data stack (postgres-timescale, redpanda, extractors, transformers) is NOT part of
# this project: it runs on the server as the separate Compose project `traffic`
# (/home/lazy_lemour/magda/infrastructure). api reaches its database over the external
# Docker network `infrastructure-network`.
#
# Images live in the dexter registry, built and pushed from docker-compose.build.yml:
#   ./dexter.sh build analyticity && ./dexter.sh push analyticity
#   ./dexter.sh remote-sync analyticity        # docker-compose.prod.yml, nginx.conf, .env
#   ./dexter.sh remote-sync-data analyticity   # init_db_central.sql (before the first start)
#   ./dexter.sh remote-start analyticity
# Step by step: docs repo, deploy-dexter/README.md.
# ==========================================================

services:
  # Central DB (towns, users, settings). Seeded from init_db_central.sql on an empty volume.
  db-central:
    container_name: analyticity-db-central
    image: postgis/postgis:14-3.3
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_CENTRAL_NAME}
      POSTGRES_USER: ${DB_CENTRAL_USER}
      POSTGRES_PASSWORD: ${DB_CENTRAL_PASSWORD}
    volumes:
      - ./init_db_central.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - db_central_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_CENTRAL_USER} -d ${DB_CENTRAL_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - analyticityNetwork

  api:
    container_name: analyticity-api
    image: ${REGISTRY:-dexter.fit.vutbr.cz/analyticity}/analyticity-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_CENTRAL_HOST: db-central
      DB_CENTRAL_PORT: "5432"
    depends_on:
      db-central:
        condition: service_healthy
    networks:
      - analyticityNetwork
      - infrastructure-network

  web:
    container_name: analyticity-web
    image: ${REGISTRY:-dexter.fit.vutbr.cz/analyticity}/analyticity-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      # Served under https://dexter.fit.vutbr.cz/analyticity/brno/ (rewritten into the build at start)
      URL_BASE_PATH: /analyticity/brno
      VITE_API_BASE_URL: /analyticity/brno/api/v1
      # Sent as X-API-Key with every API call — must be one of API_KEYS in .env
      VITE_API_KEY: ${WEB_API_KEY}
      VITE_APP_CENTER_LON: ${VITE_APP_CENTER_LON:-16.6}
      VITE_APP_CENTER_LAT: ${VITE_APP_CENTER_LAT:-49.2}
      VITE_APP_CITY: ${VITE_APP_CITY:-Brno}
    networks:
      - analyticityNetwork

  proxy:
    container_name: analyticity-proxy
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web
    networks:
      - analyticityNetwork
      - network

networks:
  # shared with the server's base nginx (routes /analyticity → analyticity-proxy)
  network:
    name: kristyna-dev
    external: true
  analyticityNetwork:
    name: analyticityNetwork
  # created by the `traffic` data stack
  infrastructure-network:
    name: infrastructure-network
    external: true

volumes:
  db_central_data:
