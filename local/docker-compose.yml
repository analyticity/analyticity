# ==========================================================
# Lokálne spustenie aplikácie — na vývoj a testovanie.
#
# Bez Kafky, TimescaleDB a extraktorov: api beží nad vzorovými dátami
# (example_data_from_database), traffic-jams-backend nad CSV. Centrálna DB sa
# inicializuje z init_db_central.sql.
#
# Images sa buildia zo zdrojákov:
#   predvolene zo submodulov (sources/backend, sources/ui, db)
#   s --workspace zo susedných klonov (../api, ../web, ../central_analyticity_db)
#
# Spúšťa sa cez analyticity.sh:
#   ./analyticity.sh local:up [--workspace]
#   ./analyticity.sh local:down | local:logs [služba] | local:status | local:reset
# ==========================================================

# Python backendy sa buildia pre linux/amd64 ako v CI (napr. fiona nemá arm64 wheel),
# na Apple Silicon ich Docker Desktop spúšťa v emulácii.
#
# Porty sa dajú zmeniť premennými LOCAL_UI_PORT, LOCAL_API_PORT, LOCAL_TRAFFIC_PORT,
# LOCAL_ADMIN_PORT a LOCAL_CENTRAL_DB_PORT pri spustení.

name: analyticity-local

services:
  db-central:
    image: postgis/postgis:14-3.3
    environment:
      POSTGRES_DB: central_db
      POSTGRES_USER: db
      POSTGRES_PASSWORD: local
    volumes:
      - ${CENTRAL_DB_SRC:-../db}/centralDbCreation/init_db_central.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - db_central_data:/var/lib/postgresql/data
    ports:
      - "${LOCAL_CENTRAL_DB_PORT:-5439}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U db -d central_db"]
      interval: 5s
      timeout: 3s
      retries: 30

  admin-backend:
    platform: linux/amd64
    build: ${BACKEND_SRC:-../sources/backend}/AdminBackend
    environment:
      DB_CENTRAL_HOST: db-central
      DB_CENTRAL_PORT: "5432"
      DB_CENTRAL_NAME: central_db
      DB_CENTRAL_USER: db
      DB_CENTRAL_PASSWORD: local
      SECRET_KEY: local-development-only
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      ORIGINS: http://localhost:${LOCAL_UI_PORT:-8090}
      VITE_APP_CITY: Brno
    depends_on:
      db-central:
        condition: service_healthy
    ports:
      - "${LOCAL_ADMIN_PORT:-8093}:8082"

  api:
    platform: linux/amd64
    build: ${BACKEND_SRC:-../sources/backend}
    # Bez POSTGRES_*_BRNO premenných api servuje vzorové dáta
    environment:
      # CORS: web volá api priamo z prehliadača
      ORIGINS: http://localhost:${LOCAL_UI_PORT:-8090}
    ports:
      - "${LOCAL_API_PORT:-8091}:8000"

  traffic-jams-backend:
    platform: linux/amd64
    build: ${BACKEND_SRC:-../sources/backend}/TrafficJamsBackend
    environment:
      DATA_SOURCE: csv
    ports:
      - "${LOCAL_TRAFFIC_PORT:-8092}:8000"

  web:
    build: ${UI_SRC:-../sources/ui}
    environment:
      VITE_API_BASE_URL: http://localhost:${LOCAL_API_PORT:-8091}/api/v1
      VITE_API_BACKEND_URL: http://localhost:${LOCAL_ADMIN_PORT:-8093}/
      VITE_TRAFFIC_BASE_URL: http://localhost:${LOCAL_TRAFFIC_PORT:-8092}
      VITE_APP_CITY: Brno
      VITE_APP_CENTER_LAT: "49.2"
      VITE_APP_CENTER_LON: "16.6"
    depends_on:
      - api
      - admin-backend
      - traffic-jams-backend
    ports:
      - "${LOCAL_UI_PORT:-8090}:80"

volumes:
  db_central_data:
