events {}

http {
    include mime.types;

    upstream api_be {
        server api:8000;
    }

    upstream traffic_jams_be {
        server traffic-jams-backend:8081;
    }

    upstream admin_be {
        server admin-backend:8082;
    }

    upstream fe {
        server bp-ux-ui:80;
    }

    server {
        listen 80;

        include /etc/nginx/mime.types;

        location /analyticity/brno/api/ {
            proxy_pass http://api_be/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /analyticity/brno/traffic-jams/ {
            proxy_pass http://traffic_jams_be/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /analyticity/brno/admin/ {
            proxy_pass http://admin_be/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # bp-ux-ui serves everything from its own container root (files aren't
        # physically relocated under a subpath) — strip the prefix here so the
        # upstream sees plain root-relative requests. The browser-visible URLs
        # still carry /analyticity/brno/... because the app is built with that
        # base path baked in via URL_BASE_PATH (see docker-compose.prod.yml).
        location = /analyticity/brno {
            return 301 /analyticity/brno/;
        }

        location /analyticity/brno/ {
            rewrite ^/analyticity/brno/(.*)$ /$1 break;
            proxy_pass http://fe;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
