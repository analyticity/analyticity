events {}

http {
    include mime.types;

    upstream api_be {
        server api:8000;
    }

    upstream traffic_jams_be {
        # Internal port is 8000 (confirmed from container logs: "Uvicorn
        # running on http://0.0.0.0:8000") — 8081 is only the external host
        # port used by the standalone cities/brno deployment, not relevant
        # here since this container publishes nothing to the host.
        server traffic-jams-backend:8000;
    }

    upstream admin_be {
        # Confirmed from container logs: "Uvicorn running on
        # http://0.0.0.0:8082" — routes live at root (no /api/v1-style
        # prefix, e.g. /getTownSettings, /login), same shape as
        # traffic-jams-backend.
        server admin-backend:8082;
    }

    upstream fe {
        server bp-ux-ui:80;
    }

    server {
        listen 80;

        include /etc/nginx/mime.types;

        # base-nginx-1 doesn't forward the original Host header (nginx's
        # proxy_pass default is Host: $proxy_host, i.e. the upstream name —
        # "analyticity-proxy" here), so $host inside this container is wrong.
        # Without this, `return 301` below would build its Location header as
        # http://analyticity-proxy/... (absolute_redirect's default), which
        # only resolves inside the Docker network, not for the browser.
        absolute_redirect off;

        # api's own routes all live under /api/v1/... (confirmed from its
        # openapi.json) — strip only the /analyticity/brno city prefix and
        # pass /api/v1/... through unchanged, don't also strip /api/.
        location /analyticity/brno/api/ {
            rewrite ^/analyticity/brno/(.*)$ /$1 break;
            proxy_pass http://api_be;
            proxy_set_header Host dexter.fit.vutbr.cz;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /analyticity/brno/traffic-jams/ {
            proxy_pass http://traffic_jams_be/;
            proxy_set_header Host dexter.fit.vutbr.cz;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /analyticity/brno/admin/ {
            proxy_pass http://admin_be/;
            proxy_set_header Host dexter.fit.vutbr.cz;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # bp-ux-ui serves everything from its own container root (files aren't
        # physically relocated under a subpath) — strip the prefix here so the
        # upstream sees plain root-relative requests. The browser-visible URLs
        # still carry /analyticity/brno/... because the app is built with that
        # base path baked in via URL_BASE_PATH (see docker-compose.prod.yml).
        location = /analyticity/brno {
            return 301 /analyticity/brno/;
        }

        location /analyticity/brno/ {
            rewrite ^/analyticity/brno/(.*)$ /$1 break;
            proxy_pass http://fe;
            proxy_set_header Host dexter.fit.vutbr.cz;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
