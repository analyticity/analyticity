events {}

http {
    include /etc/nginx/mime.types;

    # Pages, SPA routes and config.js are revalidated on every visit, so a returning browser never
    # keeps a page that points to the assets of a previous release; hashed files in /assets/ cache as usual
    map $uri $web_cache_control {
        ~^/assets/  "";
        default     "no-cache";
    }

    upstream api_be {
        server api:8000;
    }

    upstream fe {
        server web:80;
    }

    server {
        listen 80;

        # base-nginx-1 doesn't forward the original Host header, so $host is the upstream
        # name here; without this a `return 301` would point the browser at
        # http://analyticity-proxy/...
        absolute_redirect off;

        # The API serves everything under /api/v1/... — strip only the /analyticity/brno prefix
        location /analyticity/brno/api/ {
            rewrite ^/analyticity/brno/(.*)$ /$1 break;
            proxy_pass http://api_be;
            proxy_set_header Host dexter.fit.vutbr.cz;
            proxy_set_header X-Real-IP $remote_addr;
            # long first requests (case-study warm-up, a week of jams); the API gzips itself
            proxy_read_timeout 300s;
        }

        location = /analyticity {
            return 301 /analyticity/;
        }

        # The web: city chooser at /analyticity/, the cities under it (/analyticity/brno/map). It is
        # built with the /analyticity base path (URL_BASE_PATH) but its files sit at the container
        # root — strip the prefix for the upstream
        location /analyticity/ {
            rewrite ^/analyticity/(.*)$ /$1 break;
            proxy_pass http://fe;
            proxy_set_header Host dexter.fit.vutbr.cz;
            proxy_set_header X-Real-IP $remote_addr;
            add_header Cache-Control $web_cache_control;
        }
    }
}
