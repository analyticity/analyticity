events {}

http {
    include mime.types;

    upstream api_be {
        server api:8000;
    }

    upstream traffic_jams_be {
        server traffic-jams-backend:8081;
    }

    upstream admin_be {
        server admin-backend:8082;
    }

    upstream fe {
        server bp-ux-ui:80;
    }

    server {
        listen 80;

        include /etc/nginx/mime.types;

        location /analyticity/brno/api/ {
            proxy_pass http://api_be/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /analyticity/brno/traffic-jams/ {
            proxy_pass http://traffic_jams_be/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /analyticity/brno/admin/ {
            proxy_pass http://admin_be/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # NOTE: bp-ux-ui has no URL-prefix support yet (see docker-compose.prod.yml
        # comment) — this will serve the SPA shell but assets/API calls baked at
        # build time may not respect the /analyticity/brno prefix until sources/ui
        # gets a Vite `base` + entrypoint sed script.
        location /analyticity/brno {
            proxy_pass http://fe/analyticity/brno/;
        }
    }
}
