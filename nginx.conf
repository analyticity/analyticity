events {}

http {
    include /etc/nginx/mime.types;

    # Pages, SPA routes and config.js are revalidated on every visit, so a returning browser never
    # keeps a page that points to the assets of a previous release; hashed files in /assets/ cache as usual
    map $uri $web_cache_control {
        ~^/assets/  "";
        default     "no-cache";
    }

    # Map tiles (OSM France HOT) are cached here: the tile server is often slow (some tiles over 60 s),
    # so the map stayed grey. Tiles change rarely; a cached tile is kept 30 days and served stale
    # while the tile server is down or slow. Volume tile_cache (docker-compose.prod.yml).
    proxy_cache_path /var/cache/nginx/tiles levels=1:2 keys_zone=tiles:10m max_size=2g inactive=90d
                     use_temp_path=off;
    # Docker's DNS: the tile host is resolved when a tile is needed, not at start (a DNS failure at
    # start would otherwise stop the whole proxy)
    resolver 127.0.0.11 valid=300s ipv6=off;

    upstream api_be {
        server api:8000;
    }

    upstream fe {
        server web:80;
    }

    server {
        listen 80;

        # base-nginx-1 doesn't forward the original Host header, so $host is the upstream
        # name here; without this a `return 301` would point the browser at
        # http://analyticity-proxy/...
        absolute_redirect off;

        # The API serves everything under /api/v1/... — strip only the /analyticity/brno prefix
        location /analyticity/brno/api/ {
            rewrite ^/analyticity/brno/(.*)$ /$1 break;
            proxy_pass http://api_be;
            proxy_set_header Host dexter.fit.vutbr.cz;
            proxy_set_header X-Real-IP $remote_addr;
            # long first requests (case-study warm-up, a week of jams); the API gzips itself
            proxy_read_timeout 300s;
        }

        # /analyticity/tiles/hot/{z}/{x}/{y}.png → https://a.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png
        location ~ ^/analyticity/tiles/hot/(\d+)/(\d+)/(\d+)\.png$ {
            set $tile_host a.tile.openstreetmap.fr;
            proxy_pass https://$tile_host/hot/$1/$2/$3.png;
            proxy_ssl_server_name on;
            proxy_ssl_name $tile_host;
            proxy_set_header Host $tile_host;
            proxy_set_header User-Agent "Analyticity tile cache (+https://dexter.fit.vutbr.cz/analyticity/)";
            proxy_set_header Cookie "";
            proxy_connect_timeout 10s;
            proxy_read_timeout 45s;
            # the host resolves to several servers; try at most two, within 90 s in total
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 90s;
            # a slow tile is still fetched and cached when the browser has given up on it
            proxy_ignore_client_abort on;

            proxy_cache tiles;
            proxy_cache_key $1/$2/$3;
            proxy_cache_valid 200 30d;
            proxy_cache_valid 404 1h;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            # one request per tile goes to the tile server, the others wait for it
            proxy_cache_lock on;
            proxy_cache_lock_timeout 90s;
            proxy_ignore_headers Cache-Control Expires Set-Cookie;
            proxy_hide_header Set-Cookie;
            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;

            add_header Cache-Control "public, max-age=604800";
            add_header X-Cache-Status $upstream_cache_status;
        }

        location /analyticity/tiles/ {
            return 404;
        }

        location = /analyticity {
            return 301 /analyticity/;
        }

        # The web: city chooser at /analyticity/, the cities under it (/analyticity/brno/map). It is
        # built with the /analyticity base path (URL_BASE_PATH) but its files sit at the container
        # root — strip the prefix for the upstream
        location /analyticity/ {
            rewrite ^/analyticity/(.*)$ /$1 break;
            proxy_pass http://fe;
            proxy_set_header Host dexter.fit.vutbr.cz;
            proxy_set_header X-Real-IP $remote_addr;
            add_header Cache-Control $web_cache_control;
        }
    }
}
